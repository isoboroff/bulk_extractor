name: macOS App Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test macOS App (Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew update
          brew install autoconf automake libtool libxml2 libewf exiv2 json-c re2 abseil pkg-config
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/libxml2/bin" >> $GITHUB_PATH
          echo "LDFLAGS=-L/opt/homebrew/lib -L/opt/homebrew/opt/libxml2/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/include -I/opt/homebrew/opt/libxml2/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/libxml2/lib/pkgconfig" >> $GITHUB_ENV

      - name: Bootstrap and Build C++ Core
        run: |
          bash bootstrap.sh
          ./configure
          make -j$(sysctl -n hw.ncpu || echo 2)
          src/bulk_extractor -V

      - name: Run Core Test Suite
        run: |
          make check -j$(sysctl -n hw.ncpu || echo 2)

      - name: Build and Bundle Standalone macOS App
        run: |
          cd mac_gui
          chmod +x build_app.sh bundle_dependencies.py
          ./build_app.sh

      - name: Verify Bundled App Standalone Execution
        run: |
          ./mac_gui/build/BulkExtractor.app/Contents/Helpers/bulk_extractor -V
          ./mac_gui/build/BulkExtractor.app/Contents/Helpers/bulk_extractor -H

      - name: Create Zip Archive
        run: |
          cd mac_gui/build
          ditto -c -k --sequesterRsrc --keepParent BulkExtractor.app BulkExtractor-macOS.zip

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BulkExtractor-macOS-App
          path: mac_gui/build/BulkExtractor-macOS.zip
          retention-days: 14
